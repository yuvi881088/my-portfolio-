<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Web Sender</title>
    <!-- Modern Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6; /* Telegram Blue */
            --secondary: #0ea5e9;
            --bg-color: #0f172a;
            --surface: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background Elements */
        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.5;
            animation: float 10s infinite ease-in-out alternate;
        }
        .blob-1 {
            width: 500px;
            height: 500px;
            background: var(--primary);
            top: -150px;
            left: -150px;
            border-radius: 50%;
        }
        .blob-2 {
            width: 400px;
            height: 400px;
            background: #8b5cf6;
            bottom: -100px;
            right: -100px;
            border-radius: 50%;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, -50px) scale(1.1); }
        }

        /* Glassmorphism Container */
        .container {
            position: relative;
            z-index: 10;
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6);
        }

        h1 {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 10px;
            font-weight: 800;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 0.9rem;
            font-weight: 600;
        }

        input, textarea {
            width: 100%;
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        input:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            background: rgba(0, 0, 0, 0.4);
        }

        button {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        button:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        #status {
            margin-top: 20px;
            text-align: center;
            font-weight: 600;
            font-size: 0.95rem;
            min-height: 24px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .success { color: #4ade80; }
        .error { color: #f87171; }
        .show { opacity: 1 !important; }

    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="container">
        <h1>Send to Telegram</h1>
        <p>Send messages using Telegram Bot API directly from browser.</p>
        
        <div class="input-group">
            <label for="bot-token">Bot Token</label>
            <input type="text" id="bot-token" placeholder="123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11" autocomplete="off">
        </div>

        <div class="input-group">
            <label for="chat-id">Chat ID</label>
            <input type="text" id="chat-id" placeholder="-1001234567890 or 123456789" autocomplete="off">
        </div>
        
        <div class="input-group">
            <label for="message">Message</label>
            <textarea id="message" placeholder="Type your message here..."></textarea>
        </div>
        
        <button id="send-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            Send Message
        </button>

        <div id="status"></div>
    </div>

    <script>
        const tokenInput = document.getElementById('bot-token');
        const chatIdInput = document.getElementById('chat-id');
        const messageInput = document.getElementById('message');
        const sendBtn = document.getElementById('send-btn');
        const statusDiv = document.getElementById('status');

        function showStatus(text, type) {
            statusDiv.textContent = text;
            statusDiv.className = type + ' show';
            setTimeout(() => {
                statusDiv.classList.remove('show');
            }, 5000);
        }

        sendBtn.addEventListener('click', async () => {
            const token = tokenInput.value.trim();
            const chatId = chatIdInput.value.trim();
            const message = messageInput.value.trim();

            if (!token) {
                tokenInput.focus();
                return showStatus('Please enter Bot Token', 'error');
            }
            if (!chatId) {
                chatIdInput.focus();
                return showStatus('Please enter Chat ID', 'error');
            }
            if (!message) {
                messageInput.focus();
                return showStatus('Please enter a message', 'error');
            }

            // Disable button while sending
            sendBtn.disabled = true;
            sendBtn.innerHTML = 'Sending...';

            // Telegram API URL
            const url = `https://api.telegram.org/bot${token}/sendMessage`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: message
                    })
                });

                const data = await response.json();

                if (data.ok) {
                    showStatus('Message sent successfully! 🚀', 'success');
                    messageInput.value = ''; // Clear message after sending
                } else {
                    showStatus(`Error: ${data.description}`, 'error');
                }
            } catch (error) {
                showStatus('Failed to send. Please check your internet connection.', 'error');
            } finally {
                // Re-enable button
                sendBtn.disabled = false;
                sendBtn.innerHTML = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg> Send Message`;
            }
        });
    </script>
</body>
</html>
